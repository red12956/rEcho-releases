<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="rEcho — reading, handwriting, and questions.">
  <title>rEcho</title>
  <link rel="icon" href="assets/app-icon.svg?v=03bdb599da2cced2" type="image/svg+xml">
  <style>:root {
  color-scheme: light dark;
  --md-sys-color-primary: #2d568d;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-surface: #f8f9fc;
  --md-sys-color-surface-container: #edf0f6;
  --md-sys-color-surface-container-low: #f1f3f8;
  --md-sys-color-on-surface: #1b1c20;
  --md-sys-color-on-surface-variant: #59616f;
  --md-sys-color-secondary-container: #dce7f8;
  --md-sys-color-on-secondary-container: #162b49;
  --md-sys-typescale-label-large-font: system-ui, sans-serif;
  --md-sys-typescale-body-large-font: system-ui, sans-serif;
  --md-filled-tonal-button-container-shape: 8px;
  --md-menu-container-shape: 16px;
  --download-row-gap: 12px;
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  font-synthesis: none;
  line-height: 1.5;
}
* { box-sizing: border-box; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
}
main {
  width: min(calc(100% - 48px), 760px);
  flex: 1 0 auto;
  margin: 0 auto;
  padding: clamp(32px, 6vh, 72px) 0 32px;
  text-align: center;
}
.app-icon { display: block; margin: 0 auto; }
h1 { margin: 12px 0 4px; font-size: 36px; line-height: 1.25; font-weight: 500; letter-spacing: -1px; }
#downloads { margin-top: 36px; text-align: start; }
.downloads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; gap: 16px; }
.download-column { display: grid; gap: 16px; }
.package { padding: 24px; border-radius: 16px; background: var(--md-sys-color-surface-container-low); }
.package-heading { display: flex; align-items: center; gap: 12px; }
.package-heading h3 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.25px; }
.platform-icon { width: 28px; height: 28px; fill: #000000; flex: 0 0 auto; }
.version-region { display: flex; align-items: center; min-height: 24px; margin-top: 4px; }
.package-version { margin: 0; color: var(--md-sys-color-on-surface-variant); font-size: 13px; }
md-circular-progress { width: 20px; height: 20px; --md-circular-progress-size: 20px; --md-circular-progress-active-indicator-width: 3px; }
md-circular-progress:not(:defined) { visibility: hidden; }
.package-options { display: grid; gap: var(--download-row-gap); margin-top: 8px; }
.linux-package { display: flex; flex-direction: column; }
.linux-package .package-options { display: grid; flex: 1; grid-template-rows: max-content minmax(24px, 1fr) max-content; gap: 0; }
.architecture-group { display: grid; gap: var(--download-row-gap); }
.architecture-divider { align-self: center; width: 100%; }
.package-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.package-details { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 12px; row-gap: 2px; margin: 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
.package-spec { display: grid; grid-template-columns: 6ch 4ch; column-gap: 8px; }
.package-size { font-size: 12px; }
md-filled-tonal-button { min-height: 40px; --md-filled-tonal-button-label-text-size: 14px; }
md-filled-tonal-button svg { width: 18px; height: 18px; fill: currentColor; }
footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; }
.footer-left, .footer-right { display: flex; align-items: center; gap: 8px; }
footer small { color: var(--md-sys-color-on-surface-variant); font-size: 12px; }
.language-picker { position: relative; }
md-menu { min-width: 168px; --md-menu-container-color: var(--md-sys-color-surface-container); }
md-menu-item[aria-selected="true"] { --md-menu-item-container-color: var(--md-sys-color-secondary-container); --md-menu-item-label-text-color: var(--md-sys-color-on-secondary-container); }
md-icon-button { width: 48px; height: 48px; }
md-icon-button svg { width: 24px; height: 24px; fill: currentColor; }
[hidden] { display: none !important; }
noscript a { display: inline-block; margin-top: 24px; color: var(--md-sys-color-primary); }
@media (prefers-color-scheme: dark) {
  :root {
    --md-sys-color-primary: #a6c7fa;
    --md-sys-color-on-primary: #142e4d;
    --md-sys-color-surface: #101318;
    --md-sys-color-surface-container: #262d38;
    --md-sys-color-surface-container-low: #1b222c;
    --md-sys-color-on-surface: #edf0f7;
    --md-sys-color-on-surface-variant: #b5bfce;
    --md-sys-color-secondary-container: #304767;
    --md-sys-color-on-secondary-container: #dce7f8;
  }
}
@media (prefers-color-scheme: dark) { .platform-icon { fill: #ffffff; } }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
@media (max-width: 540px) {
  main { width: min(calc(100% - 32px), 380px); padding-top: 40px; }
  #downloads { margin-top: 36px; }
  .downloads { grid-template-columns: 1fr; gap: 12px; }
  .download-column { gap: 12px; }
  .linux-package .package-options { flex: none; grid-template-rows: max-content 32px max-content; gap: 0; }
  .package { padding: 20px; }
  footer { padding: 12px 16px; gap: 4px; }
  .footer-left, .footer-right { gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  md-filled-tonal-button, md-icon-button { --md-ripple-hover-duration: 0ms; --md-ripple-pressed-duration: 0ms; }
}
md-filled-tonal-button:not(:defined) {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; border-radius: 8px;
  background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font-size: 14px;
}
md-filled-tonal-button:not(:defined)[disabled] { opacity: .5; }
md-icon-button:not(:defined) { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--md-sys-color-on-surface-variant); }
md-menu:not(:defined) { display: none; }

.apple-package { grid-column: 1 / -1; }
.apple-platforms { min-width: 0; }
.apple-package md-filled-tonal-button { flex-shrink: 0; }
</style>

</head>
