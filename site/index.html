  <style>:root {
  color-scheme: light dark;

  --md-sys-color-on-primary: #ffffff;

  --md-sys-color-surface-container: #edf0f6;
  --md-sys-color-surface-container-low: #f1f3f8;
  --md-sys-color-on-surface: #1b1c20;
  --md-sys-color-on-surface-variant: #59616f;
  --md-sys-color-secondary-container: #dce7f8;

}
* { box-sizing: border-box; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
}
main {
  width: min(calc(100% - 48px), 760px);
  flex: 1 0 auto;
  margin: 0 auto;
  padding: clamp(32px, 6vh, 72px) 0 32px;
  text-align: center;
}
.app-icon { display: block; margin: 0 auto; }
h1 { margin: 12px 0 4px; font-size: 36px; line-height: 1.25; font-weight: 500; letter-spacing: -1px; }
.description { margin: 0; color: var(--md-sys-color-on-surface-variant); font-size: 15px; }

.download-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; margin-bottom: 16px; }
.download-heading h2 { margin: 0; font-size: 20px; font-weight: 500; }
.release-state { display: flex; align-items: center; gap: 4px; color: var(--md-sys-color-on-surface-variant); font-size: 13px; }
.downloads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.package { padding: 24px; border-radius: 16px; background: var(--md-sys-color-surface-container-low); }
.package-heading { display: flex; align-items: center; gap: 12px; }
.package-heading h3 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.25px; }
.platform-icon { width: 28px; height: 28px; fill: var(--md-sys-color-primary); flex: 0 0 auto; }
.requirements { margin: 12px 0 20px; color: var(--md-sys-color-on-surface-variant); font-size: 14px; }
.package-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.package-details { margin: 0; font-size: 13px; color: var(--md-sys-color-on-surface-variant); }
.package-details span { margin-inline: 4px; }
md-filled-tonal-button { min-height: 40px; --md-filled-tonal-button-label-text-size: 14px; }
md-filled-tonal-button svg { width: 18px; height: 18px; fill: currentColor; }
footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; }
.footer-left, .footer-right { display: flex; align-items: center; gap: 8px; }
footer small { color: var(--md-sys-color-on-surface-variant); font-size: 12px; }
.language-picker { position: relative; }
md-menu { min-width: 168px; --md-menu-container-color: var(--md-sys-color-surface-container); }
md-menu-item[aria-selected="true"] { --md-menu-item-container-color: var(--md-sys-color-secondary-container); --md-menu-item-label-text-color: var(--md-sys-color-on-secondary-container); }
md-icon-button { width: 48px; height: 48px; }
md-icon-button svg { width: 24px; height: 24px; fill: currentColor; }
[hidden] { display: none !important; }
noscript a { display: inline-block; margin-top: 24px; color: var(--md-sys-color-primary); }
@media (prefers-color-scheme: dark) {
  :root {
    --md-sys-color-primary: #a6c7fa;
    --md-sys-color-on-primary: #142e4d;
    --md-sys-color-surface: #101318;
    --md-sys-color-surface-container: #262d38;
    --md-sys-color-surface-container-low: #1b222c;
    --md-sys-color-on-surface: #edf0f7;
    --md-sys-color-on-surface-variant: #b5bfce;
    --md-sys-color-secondary-container: #304767;
    --md-sys-color-on-secondary-container: #dce7f8;
  }
}
@media (max-width: 540px) {
  main { width: min(calc(100% - 32px), 380px); padding-top: 40px; }
  #downloads { margin-top: 36px; }
  .downloads { grid-template-columns: 1fr; gap: 12px; }
  .package { padding: 20px; }
  footer { padding: 12px 16px; gap: 4px; }
  .footer-left, .footer-right { gap: 0; }
}
@media (prefers-reduced-motion: reduce) {
  md-filled-tonal-button, md-icon-button { --md-ripple-hover-duration: 0ms; --md-ripple-pressed-duration: 0ms; }
}
md-filled-tonal-button:not(:defined) {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; border-radius: 8px;
  background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font-size: 14px;
}
md-filled-tonal-button:not(:defined)[disabled] { opacity: .5; }
md-icon-button:not(:defined) { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--md-sys-color-on-surface-variant); }
md-menu:not(:defined) { display: none; }
</style>
